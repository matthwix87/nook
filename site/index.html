<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="color-scheme" content="dark">
  <title>Chat</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Loading -->
  <section id="view-loading" class="center-view">
    <div class="spinner" aria-label="Loading"></div>
  </section>

  <!-- Offline / not working -->
  <section id="view-offline" class="center-view" hidden>
    <div class="card narrow">
      <div class="big-icon">&#x1F4A4;</div>
      <h1>Currently not working</h1>
      <p class="muted" id="offline-detail">The host's computer is offline. Try again later.</p>
      <button class="btn primary" id="offline-retry">Retry</button>
    </div>
  </section>

  <!-- Disabled -->
  <section id="view-disabled" class="center-view" hidden>
    <div class="card narrow">
      <div class="big-icon">&#x23F8;&#xFE0F;</div>
      <h1>Account paused</h1>
      <p class="muted">Your account is temporarily disabled.</p>
      <p id="disabled-until"></p>
      <div class="row gap">
        <button class="btn primary" id="disabled-retry">Check again</button>
        <button class="btn" data-action="logout">Log out</button>
      </div>
    </div>
  </section>

  <!-- Login -->
  <section id="view-login" class="center-view" hidden>
    <form class="card narrow" id="login-form" autocomplete="on">
      <div class="logo"><img src="icons/icon.svg" alt="" width="56" height="56"></div>
      <h1>Sign in</h1>
      <label>Username
        <input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>
      <label>Key
        <input name="key" type="password" autocomplete="current-password" spellcheck="false" required>
      </label>
      <p class="error" id="login-error" hidden></p>
      <button class="btn primary wide" type="submit">Sign in</button>
    </form>
  </section>

  <!-- Chat -->
  <section id="view-chat" class="app" hidden>
    <aside id="drawer" class="drawer">
      <div class="drawer-head">
        <button class="btn primary wide" id="new-chat">+ New chat</button>
      </div>
      <nav id="conv-list" class="conv-list"></nav>
      <div class="drawer-foot">
        <div class="meter" id="meter">
          <div class="meter-label" id="meter-label"></div>
          <div class="meter-bar"><div id="meter-fill"></div></div>
          <div class="meter-sub muted" id="meter-sub"></div>
        </div>
        <button class="btn wide" id="open-admin" hidden>Admin</button>
        <button class="btn wide ghost" data-action="logout">Log out <span id="whoami" class="muted"></span></button>
      </div>
    </aside>
    <div id="scrim" class="scrim" hidden></div>
    <main class="chat-main">
      <header class="topbar">
        <button class="icon-btn" id="menu-btn" aria-label="Conversations">&#9776;</button>
        <div class="topbar-title" id="chat-title">New chat</div>
        <button class="icon-btn" id="delete-chat" aria-label="Delete chat" title="Delete chat" hidden>&#128465;</button>
      </header>
      <div id="messages" class="messages">
        <div class="empty-hint" id="empty-hint">Ask me anything.</div>
      </div>
      <form id="composer" class="composer">
        <textarea id="input" rows="1" placeholder="Message" enterkeyhint="send"></textarea>
        <button class="send-btn" id="send" type="submit" aria-label="Send">&#10148;</button>
      </form>
    </main>
  </section>

  <!-- Admin -->
  <section id="view-admin" class="admin" hidden>
    <header class="topbar">
      <button class="icon-btn" id="admin-back" aria-label="Back">&#8592;</button>
      <div class="topbar-title">Accounts</div>
      <span></span>
    </header>
    <div class="admin-body">
      <form class="card" id="create-form">
        <h2>Create account</h2>
        <div class="grid3">
          <label>Username <input name="username" autocapitalize="none" spellcheck="false" required></label>
          <label>Daily tokens <input name="daily_allowance" type="number" min="0" step="1000" value="20000"></label>
          <label>Top-up tokens <input name="topup" type="number" min="0" step="1000" value="0"></label>
        </div>
        <p class="error" id="create-error" hidden></p>
        <button class="btn primary" type="submit">Create</button>
      </form>
      <div class="card keybox" id="keybox" hidden>
        <h2 id="keybox-title">New key</h2>
        <p class="muted">Shown only once. Send it to your friend now.</p>
        <div class="row gap">
          <code id="keybox-key" class="keytext"></code>
          <button class="btn" id="keybox-copy">Copy</button>
        </div>
        <button class="btn ghost" id="keybox-close">Done</button>
      </div>
      <input id="search" class="search" type="search" placeholder="Search by username or paste a key" autocapitalize="none" spellcheck="false">
      <div id="accounts"></div>
    </div>
  </section>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
